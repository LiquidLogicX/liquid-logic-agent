<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=390"/>
<title>Ledger card empty state — 390px</title>
<style>
:root {
  /* ground — unchanged */
  --navy: #0b1c2c;
  --navy-deep: #07141f;
  --navy-card: #122536;
  --cream: #f4efe4;
  --cream-ink: #1c2a36;
  --cream-muted: #5c6b78;
  --text: #eef3f7;
  --muted: #9eb0bf;
  --radius: 14px;

  /* brand accents — from the LLX mark */
  --accent: #7b4bd8;        /* liquid purple — buttons, fills */
  --accent-soft: #b98cf0;   /* lighter purple — links on navy */
  --accent-deep: #4a2a8f;   /* shadow purple — gradients */
  --metal: #c9d2dc;         /* chrome — stat numbers, rules */
  --metal-dim: #8e9aa6;

  /* aliases: existing rules keep working, no component edits needed */
  --gold: var(--accent);
  --gold-soft: var(--accent-soft);

  --line: rgba(123, 75, 216, 0.30);
}
body {
  margin: 0;
  min-height: 100vh;
  background: #071018;
  color: var(--text, #e8eef5);
  font-family: system-ui, sans-serif;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 1.25rem;
}
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.92em;
}.truncate {
  display: inline-block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: bottom;
}.hero-panel {
  background: linear-gradient(160deg, var(--navy-card), #0e2233 70%);
  isolation: isolate;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.35rem 1.4rem 1.5rem;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
}.hero-panel-kicker {
  margin: 0 0 1rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.72rem;
  color: var(--gold);
  font-weight: 600;
}.hero-panel-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1.15rem;
}.kpi-label, .stat-label {
  display: block;
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 0.25rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}.kpi-value {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 2rem;
  color: var(--metal);
}.hero-panel-recent p { margin: 0.2rem 0 0.55rem; color: var(--text); }.hero-panel--empty {
  padding: 0.85rem 1.1rem 1rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}.hero-panel--empty .hero-panel-kicker {
  margin-bottom: 0.45rem;
}.hero-panel-empty-msg {
  margin: 0;
  font-size: 0.92rem;
  line-height: 1.45;
  color: var(--muted);
}.hero-panel-payment-list {
  list-style: none;
  margin: 0.35rem 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}.hero-panel-payment-list li p {
  margin: 0.15rem 0 0.35rem;
}.small { font-size: 0.88rem; }.muted { color: var(--muted); }.small {
  font-size: 0.8rem;
}
</style>
</head>
<body>
  <aside class="hero-panel hero-panel--empty" aria-label="Live ledger summary" style="width:100%;max-width:358px">
    <p class="hero-panel-kicker">Live from ledger</p>
    <p class="hero-panel-empty-msg">No payments yet — the first one will appear here with its BaseScan link.</p>
  </aside>
</body>
</html>
