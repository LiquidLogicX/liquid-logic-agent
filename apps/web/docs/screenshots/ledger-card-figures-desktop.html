<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280"/>
<title>Ledger card figures — 1280px</title>
<style>
:root {
  --navy: #0b1c2c;
  --navy-deep: #07141f;
  --navy-card: #122536;
  --cream: #f4efe4;
  --cream-ink: #1c2a36;
  --cream-muted: #5c6b78;
  --text: #eef3f7;
  --muted: #9eb0bf;
  --radius: 14px;
  --accent: #7b4bd8;
  --accent-soft: #b98cf0;
  --accent-deep: #4a2a8f;
  --metal: #c9d2dc;
  --metal-dim: #8e9aa6;
  --gold: var(--accent);
  --gold-soft: var(--accent-soft);
  --line: rgba(123, 75, 216, 0.30);
}
body {
  margin: 0;
  min-height: 100vh;
  background: #071018;
  color: var(--text);
  font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 1.5rem;
}
.hero-panel {
  background: linear-gradient(160deg, var(--navy-card), #0e2233 70%);
  isolation: isolate;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.35rem 1.4rem 1.5rem;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
}
.hero-panel-kicker {
  margin: 0 0 1rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.72rem;
  color: var(--gold);
  font-weight: 600;
}
.hero-panel-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1.15rem;
}
.kpi-label {
  display: block;
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 0.25rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.kpi-value {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 2rem;
  color: var(--metal);
}
.hero-panel--empty {
  padding: 0.85rem 1.1rem 1rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  align-self: start;
}
.hero-panel--empty .hero-panel-kicker { margin-bottom: 0.55rem; }
.hero-panel-grid--solo { margin-bottom: 0.65rem; }
.hero-panel--empty .kpi-value { font-size: 1.65rem; }
.hero-panel-empty-msg {
  margin: 0;
  font-size: 0.92rem;
  line-height: 1.45;
  color: var(--muted);
}
</style>
</head>
<body>

  <aside class="hero-panel hero-panel--empty" aria-label="Live ledger summary" style="width:100%;max-width:420px">
    <p class="hero-panel-kicker">Live from ledger</p>
    <div class="hero-panel-grid hero-panel-grid--solo">
      <div>
        <span class="kpi-label">Total USDC spent</span>
        <span class="kpi-value">0</span>
      </div>
      <div>
        <span class="kpi-label">Payments</span>
        <span class="kpi-value">0</span>
      </div>
    </div>
    <p class="hero-panel-empty-msg">No payments yet — the first one will appear here with its BaseScan link.</p>
  </aside>

</body>
</html>
