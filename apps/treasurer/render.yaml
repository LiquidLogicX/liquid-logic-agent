# Render Blueprint — Liquid Logic Treasurer
# Account: hello@liquidlogicx.com
# Instance / plan: starter
# Network: Base mainnet (omit CDP_X402_ENVIRONMENT). Development uses Base Sepolia.
#
# Deploy from repo root. After deploy, use Render Shell / one-off jobs for CLI:
#   node dist/cli/index.js print-wallet-address
#   node dist/cli/index.js pay <url>
# Operator freeze (on the instance; background workers have no public URL):
#   curl -X POST http://127.0.0.1:$PORT/api/freeze -H "Authorization: Bearer $LLX_OPERATOR_TOKEN"
previewsEnabled: false
services:
  - type: worker
    name: liquid-logic-treasurer
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/treasurer/Dockerfile
    dockerContext: .
    region: oregon
    envVars:
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: CDP_WALLET_SECRET
        sync: false
      - key: TREASURER_LEDGER_PATH
        value: /app/data/ledger.jsonl
      - key: TREASURER_ALLOWLIST
        sync: false
      - key: TREASURER_MAX_PER_PAYMENT_USDC
        value: "1.00"
      - key: TREASURER_DAILY_CAP_USDC
        value: "10.00"
      - key: TREASURER_WALLET_ACCOUNT_NAME
        value: x402-client-wallet-1
      - key: LEDGER_SYNC_GITHUB_TOKEN
        sync: false
      - key: LEDGER_SYNC_REPO
        value: LiquidLogicX/liquid-logic-agent
      - key: LEDGER_SYNC_PATH
        value: data/ledger.jsonl
      - key: LEDGER_SYNC_INTERVAL_MS
        value: "300000"
      - key: LLX_OPERATOR_TOKEN
        sync: false
      - key: PORT
        value: "10000"
    disk:
      name: treasurer-ledger
      mountPath: /app/data
      sizeGB: 1
