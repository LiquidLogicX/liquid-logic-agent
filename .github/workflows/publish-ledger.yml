name: Publish ledger

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/ledger.jsonl"
      - "packages/ledger-publisher/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build -w @liquid-logic/shared && npm run build -w @liquid-logic/ledger-publisher
      - name: Publish public ledger + social drafts
        env:
          LEDGER_JSONL_PATH: data/ledger.jsonl
          LEDGER_OUT_DIR: public/ledger
          SOCIAL_DRAFTS_DIR: drafts/social
          AGENT_WALLET_ADDRESS: ${{ secrets.AGENT_WALLET_ADDRESS }}
        run: npm run publish-ledger
      - name: Mirror into apps/web/public/ledger for the site
        run: |
          mkdir -p apps/web/public/ledger
          cp -a public/ledger/. apps/web/public/ledger/
      - name: Commit artifacts (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ledger apps/web/public/ledger drafts/social
          git diff --staged --quiet || git commit -m "chore(ledger): publish public ledger and social drafts"
          git push || true
