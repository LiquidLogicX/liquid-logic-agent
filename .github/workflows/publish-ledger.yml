name: Publish ledger

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/ledger.jsonl"
      - "packages/ledger-publisher/**"

concurrency:
  group: publish-ledger
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build -w @liquid-logic/shared && npm run build -w @liquid-logic/ledger-publisher
      # main is protected, so the previous run's checkpoint is on
      # automation/ledger-publish, not on the main checkout. Restore it (and
      # the ledger rows that go with it) or the next run rescans from the
      # stale cursor — ~1.26M blocks as of 2026-11-04, and more after Denim.
      - name: Restore chain-sync checkpoint
        run: |
          mkdir -p "$RUNNER_TEMP/ledger-resume"
          if git fetch --depth=1 origin automation/ledger-publish; then
            if git cat-file -e FETCH_HEAD:data/chain-sync.json && git cat-file -e FETCH_HEAD:data/ledger.jsonl; then
              git show FETCH_HEAD:data/chain-sync.json > "$RUNNER_TEMP/ledger-resume/chain-sync.json"
              git show FETCH_HEAD:data/ledger.jsonl > "$RUNNER_TEMP/ledger-resume/ledger.jsonl"
              echo "Restored checkpoint from automation/ledger-publish"
              node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log("resume lastScannedBlock", j.lastScannedBlock);' "$RUNNER_TEMP/ledger-resume/chain-sync.json"
            else
              echo "automation/ledger-publish has no checkpoint yet."
            fi
          else
            echo "automation/ledger-publish unavailable; using data/chain-sync.json on this checkout."
          fi
      # Append Base USDC Transfers to the x402 payTo that are missing from
      # data/ledger.jsonl. One run scans at most LEDGER_CHAIN_SYNC_MAX_BLOCKS
      # (250000, above Denim's ~108000 blocks / 6h) in ≤500-block eth_getLogs
      # chunks, then writes data/chain-sync.json at the last block it finished.
      - name: Reconcile payTo receipts from Base
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          LEDGER_JSONL_PATH: data/ledger.jsonl
          # mainnet.base.org (fallback when BASE_RPC_URL unset) caps eth_getLogs at 500.
          LEDGER_CHAIN_SYNC_CHUNK: "500"
          LEDGER_CHAIN_SYNC_MAX_BLOCKS: "250000"
          LEDGER_CHAIN_SYNC_RESUME_CURSOR: ${{ runner.temp }}/ledger-resume/chain-sync.json
          LEDGER_CHAIN_SYNC_RESUME_LEDGER: ${{ runner.temp }}/ledger-resume/ledger.jsonl
        run: npm run chain-sync-ledger
      - name: Publish public ledger + social drafts
        env:
          LEDGER_JSONL_PATH: data/ledger.jsonl
          LEDGER_OUT_DIR: public/ledger
          SOCIAL_DRAFTS_DIR: drafts/social
          AGENT_WALLET_ADDRESS: ${{ secrets.AGENT_WALLET_ADDRESS }}
        run: npm run publish-ledger
      - name: Mirror into web + audit public/ledger
        run: |
          mkdir -p apps/web/public/ledger apps/audit/public/ledger
          cp -a public/ledger/. apps/web/public/ledger/
          cp -a public/ledger/. apps/audit/public/ledger/
      # main is protected ("Changes must be made through a pull request"), so a
      # direct push is rejected. The old step hid that with `git push || true`
      # and the public ledger silently stopped updating on 2026-09-22.
      # Now: skip timestamp-only churn; try a direct push; if rejected, open or
      # refresh an automation PR for Miles to merge. Any other failure is red.
      - name: Commit artifacts (if materially changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.jsonl data/chain-sync.json public/ledger apps/web/public/ledger apps/audit/public/ledger drafts/social
          # generatedAt / today churn is not a publish. A checkpoint advance is:
          # without it the next checkout of main rescans the same blocks. Commit
          # the cursor on its own when the ledger itself did not change.
          if git diff --staged --quiet -I '"generatedAt"' -I '"today"' -- . ':(exclude)data/chain-sync.json'; then
            git reset -q
            git add -- data/chain-sync.json
            if git diff --staged --quiet; then
              echo "No material ledger change and checkpoint unchanged — nothing to publish."
              exit 0
            fi
            git commit -m "chore(ledger): advance chain-sync checkpoint"
          else
            git commit -m "chore(ledger): publish public ledger and social drafts"
          fi
          if git push origin HEAD:main; then
            exit 0
          fi
          echo "::warning::Direct push to protected main rejected — opening/refreshing an automation PR."
          BR=automation/ledger-publish
          git push --force origin HEAD:refs/heads/$BR
          if [ "$(gh pr list --head "$BR" --base main --state open --json number --jq 'length')" != "0" ]; then
            echo "Automation PR already open — branch $BR refreshed."
            exit 0
          fi
          if ! gh pr create --base main --head "$BR" \
              --title "chore(ledger): publish ledger (automated)" \
              --body "Automated by the Publish ledger workflow: new payTo receipts reconciled from Base and republished public/ledger. main is protected, so this needs a human merge."; then
            # Repo setting "Allow GitHub Actions to create and approve pull requests" is off.
            echo "::error::Ledger changes pushed to branch $BR but this workflow may not open PRs. Open it by hand: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...$BR"
            exit 1
          fi
